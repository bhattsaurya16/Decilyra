services:
  postgres:
    image: postgres:16-alpine
    container_name: decilyra-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: decilyra
      POSTGRES_PASSWORD: decilyra
      POSTGRES_DB: decilyra
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U decilyra -d decilyra"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
